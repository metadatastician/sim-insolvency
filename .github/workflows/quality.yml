# This workflow is managed by gh actions-lock.
name: quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  zig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
      - run: zig fmt --check build.zig zig
      - run: zig build test
      - run: zig build wasm
      - run: ./tools/validate-scenario.sh
      - run: ./tools/check-abi-drift.sh
      - run: ./tools/check-no-prohibited-stack.sh
      - run: ./tools/check-wiki-health.sh
      - run: ./tools/check-hidden-truth.sh
      - run: ./tools/test-hidden-truth-scanner.sh
